# Blueprint de Render: describe la API y su base de datos como código, de modo que el despliegue se
# pueda reproducir sin ir apretando botones en un panel.
#
# Render lee este archivo al crear el Blueprint y levanta los dos recursos ya enlazados entre sí.

services:
  - name: mineops-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile

    # No se da por bueno el despliegue hasta que el contexto de Spring esté arriba. En el primer
    # arranque Flyway crea las diez tablas y el seed carga el conjunto de demostración antes de que
    # este endpoint responda UP.
    healthCheckPath: /actuator/health

    envVars:
      # La base llega desarmada en piezas; application.yml compone con ellas la URL JDBC.
      - key: DB_HOST
        fromDatabase:
          name: mineops-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mineops-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mineops-db
          property: database
      - key: DATASOURCE_USERNAME
        fromDatabase:
          name: mineops-db
          property: user
      - key: DATASOURCE_PASSWORD
        fromDatabase:
          name: mineops-db
          property: password

      # Se completa en el panel al crear el Blueprint: una clave de al menos 32 bytes. Queda fuera
      # del repositorio a propósito, porque este archivo es público.
      - key: JWT_SECRET
        sync: false

      # Origen exacto del frontend. La API compara sin comodines, así que va sin barra final.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mineops-web.vercel.app

      - key: SEED_ENABLED
        value: "true"

      # El conjunto de demostración se construye alrededor de "hoy" —el turno de día abierto, la
      # certificación que vence en tres días—, así que la zona horaria no es cosmética.
      - key: TZ
        value: America/Lima

databases:
  - name: mineops-db
    plan: free
    region: oregon
