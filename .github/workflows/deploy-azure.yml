# Construye la imagen y la despliega en Azure App Service.
#
# La API corre en App Service por una razón concreta: el plan B1 tiene "Always On", así que el
# contenedor no se duerme por inactividad y no hace falta que nadie lo despierte. La base es externa
# y se alcanza por su cadena de conexión pública, que exige SSL.
#
# La imagen se publica en GHCR y no en Azure Container Registry: el registro de GitHub es gratuito
# para repositorios públicos, mientras que el ACR más barato consumiría crédito todos los meses sin
# aportar nada que aquí se necesite.
name: deploy-azure

on:
  push:
    branches: [main]
    # Un cambio de documentación no justifica reconstruir y redesplegar la imagen.
    paths-ignore:
      - '**.md'
      - '.github/workflows/keep-alive.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Dos despliegues simultáneos sobre la misma aplicación se pisan; el último commit manda.
  group: deploy-azure
  cancel-in-progress: true

env:
  # GHCR exige el nombre en minúsculas, siempre, aunque el usuario de GitHub tenga mayúsculas.
  IMAGE: ghcr.io/loberos/mineops-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token que GitHub genera para la ejecución; no hay que crear ningún secreto para esto.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Queda grabado en el artefacto y permite comprobar después qué versión quedó sirviendo.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          # Se etiqueta con el SHA además de `latest` para que el despliegue apunte a una imagen
          # concreta: si hay que volver atrás, la anterior sigue existiendo con su propia etiqueta.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # La caché de Actions evita que Maven vuelva a bajar todas las dependencias en cada push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No se usa `azure/webapps-deploy`: esa acción escribe la imagen en
      # `siteConfig.linuxFxVersion`, que es el modelo de contenedor único clásico. Esta aplicación se
      # creó con el modelo Site Containers, donde la definición del contenedor vive en otro sitio, así
      # que la escritura tenía éxito y no cambiaba nada: el despliegue salía verde y App Service
      # seguía sirviendo la imagen anterior.
      #
      # El webhook de implementación continua sí funciona en ambos modelos: App Service vuelve a tirar
      # de la etiqueta que tiene configurada. De paso desaparece la dependencia del publish profile y
      # de la autenticación básica del SCM.
      - name: Avisar a App Service que hay imagen nueva
        env:
          WEBHOOK: ${{ secrets.AZURE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "Falta el secreto AZURE_WEBHOOK_URL (Centro de implementación > Webhook)"
            exit 1
          fi
          code=$(curl -s -X POST -o /dev/null -w '%{http_code}' --max-time 60 "$WEBHOOK")
          echo "webhook -> HTTP $code"
          # App Service contesta 202: acepta el aviso y arranca el redespliegue en segundo plano,
          # devolviendo un OperationId. Se aceptan ambos códigos porque el 200 no está garantizado y
          # el arranque real lo verifica el paso siguiente, no este.
          case "$code" in
            200|202) ;;
            *) echo "el webhook no aceptó el aviso"; exit 1 ;;
          esac

      - name: Comprobar que quedó sirviendo esta versión
        env:
          WEBHOOK: ${{ secrets.AZURE_WEBHOOK_URL }}
          # Opcional. Solo hace falta si el hostname público no se deduce del de despliegue, que es
          # el caso raro; normalmente se dejan los dos en blanco y funciona.
          HOST_EXPLICITO: ${{ vars.AZURE_APP_HOSTNAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # El hostname se deduce de la URL del webhook en lugar de pedirlo por separado: la de
          # despliegue es la pública con ".scm" intercalado, así que ya la tenemos. Declararlo dos
          # veces solo añadía una variable más que olvidar —o que declarar como secreto en vez de
          # como variable, que es lo mismo que no declararla.
          if [ -n "${HOST_EXPLICITO:-}" ]; then
            HOST="$HOST_EXPLICITO"
          else
            HOST=$(printf '%s' "$WEBHOOK" | sed -e 's|^.*@||' -e 's|/.*$||' -e 's|\.scm\.|.|')
          fi

          if [ -z "${HOST:-}" ]; then
            echo "No se pudo determinar el hostname de la aplicación."
            echo "Falta el secreto AZURE_WEBHOOK_URL, o hay que declarar la variable"
            echo "AZURE_APP_HOSTNAME con el hostname completo de la portada del App Service."
            exit 1
          fi

          URL="https://${HOST}/actuator/info"
          echo "esperando a que $URL informe el commit $SHA"

          # No basta con que la API responda: una instancia que sigue sirviendo la imagen anterior
          # contesta con el mismo 200 y el mismo UP. Lo que se comprueba es que el commit informado
          # sea este, que es la única señal capaz de distinguir un despliegue aplicado de uno que se
          # quedó por el camino.
          #
          # App Service tiene que descargar la imagen, arrancar la JVM y levantar el contexto de
          # Spring: en un B1 frío son varios minutos.
          visto=""
          for i in $(seq 1 60); do
            visto=$(curl -s --max-time 30 "$URL" | tr ',{}' '\n\n\n' | grep '"commit"' | cut -d'"' -f4 || true)
            if [ "$visto" = "$SHA" ]; then
              echo "desplegado y verificado: $SHA"
              exit 0
            fi
            echo "intento $i: sirviendo '${visto:-(sin dato)}'"
            sleep 10
          done

          echo ""
          echo "Tras diez minutos App Service sigue sirviendo '${visto:-(sin dato)}' y no '$SHA'."
          echo "Causas habituales, por frecuencia:"
          echo "  - La etiqueta del contenedor está fijada a un SHA en vez de 'latest', así que el"
          echo "    webhook avisa y App Service vuelve a descargar siempre la misma imagen."
          echo "  - La implementación continua está desactivada: el webhook acusa recibo con 202"
          echo "    pero nadie actúa sobre el aviso."
          exit 1
