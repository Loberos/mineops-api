name: mineops

# MineOps se entrega en dos repositorios. Este archivo levanta el proyecto completo y espera que
# ambos estén clonados como hermanos, con estas carpetas:
#
#   git clone https://github.com/Loberos/mineops-api.git mineopsapi
#   git clone https://github.com/Loberos/mineops-web.git mineops-web
#
# Si solo clonaste este repositorio, levanta la base y la API con:
#   docker compose up --build database api

services:
  database:
    image: postgres:17-alpine
    container_name: mineops-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineops}
      POSTGRES_USER: ${POSTGRES_USER:-mineops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mineops-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mineops} -d ${POSTGRES_DB:-mineops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: mineops-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-mineops}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-mineops}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mineops}
      JWT_SECRET: ${JWT_SECRET:-mineops-local-development-secret-key-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
      SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      # El frontend vive en el repositorio hermano mineops-web.
      context: ../mineops-web
      args:
        API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: mineops-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  mineops-database-data:
